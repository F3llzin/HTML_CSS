<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Meu primeiro formulário</h1>

    <form action="#" method="post">
        <label for="inome">Nome:</label>
        <input type="text" name="nome" id="inome" style="margin-bottom: 15px;">
        <br>

        <label for="isobre">Sobrenome:</label>
        <input type="text" name="sobre" id="isobre" style="margin-bottom: 15px;">
        <br>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
