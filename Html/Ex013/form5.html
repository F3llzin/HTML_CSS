<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="#">
        <fieldset>
            <legend>Sexo</legend>

            <input type="radio" name="sexo" id="m">
            <label for="m">Masculino</label>
            <br>

            <input type="radio" name="sexo" id="f" checked>
            <label for="f">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>

            <input type="checkbox" name="basquete" id="basquete" checked>
            <label for="basquete">Basquete</label>
            <br>
            
            <input type="checkbox" name="futebol" id="futebol" checked>
            <label for="futebol">Futebol</label>
            <br>
            
            <input type="checkbox" name="natacao" id="natacao">
            <label for="natacao">Natação</label>
            <br>
            
            <input type="checkbox" name="tenis" id="tenis">
            <label for="tenis">Tênis</label>
        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
